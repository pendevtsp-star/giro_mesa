upstream giromesa_api {
  least_conn;
  server api-a:3333 max_fails=2 fail_timeout=5s;
  server api-b:3333 max_fails=2 fail_timeout=5s;
}

server {
  listen 80;

  location / {
    proxy_pass http://giromesa_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 75s;
  }
}
