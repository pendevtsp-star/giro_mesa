name: giromesa-ab-validation

x-api-environment: &api-environment
  NODE_ENV: development
  API_PORT: 3333
  DATABASE_URL: postgres://giromesa:giromesa@postgres:5432/giromesa_ab
  DATABASE_POOL_MAX: 12
  DATABASE_POOL_IDLE_TIMEOUT_MS: 30000
  DATABASE_POOL_CONNECTION_TIMEOUT_MS: 5000
  REDIS_URL: redis://redis:6379
  REALTIME_POLL_INTERVAL_MS: 1000
  REALTIME_BATCH_LIMIT: 200
  # The proxy is the only source trusted to forward distinct synthetic client
  # addresses during the disposable F16 SSE capacity gate.
  TRUSTED_PROXY_CIDRS: 172.16.0.0/12
  # Fixed synthetic secrets for the isolated disposable topology only. They
  # intentionally match the F16 seed/runbook and are never production values.
  SESSION_SECRET: f16-local-session-secret-0123456789
  PASSWORD_PEPPER: f16-local-password-pepper
  QR_SIGNING_SECRET: f16-local-qr-signing-secret
  WHATSAPP_TRANSPORT: disabled
  IFOOD_WEBHOOK_MODE: disabled
  FISCAL_PROVIDER: mock
  FISCAL_PRODUCTION_ENABLED: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: giromesa
      POSTGRES_PASSWORD: giromesa
      POSTGRES_DB: giromesa_ab
    ports:
      - "127.0.0.1:55447:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giromesa -d giromesa_ab"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ab-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6397:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  schema-push:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@giromesa/db", "db:migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api-a:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      API_INSTANCE_ID: ab-api-a
    depends_on:
      schema-push:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 120s

  api-b:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      API_INSTANCE_ID: ab-api-b
    depends_on:
      schema-push:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 120s

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3347:80"
    volumes:
      - ./ops/ab-validation/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy

volumes:
  ab-postgres-data:
