services:
  api-a:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      API_INSTANCE_ID: local-a
      API_PORT: 3333
      DATABASE_URL: postgres://giromesa:giromesa@postgres:5432/giromesa
      DATABASE_POOL_MAX: 12
      REDIS_URL: redis://redis:6379
      REALTIME_POLL_INTERVAL_MS: 1000
      REALTIME_BATCH_LIMIT: 200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-b:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      API_INSTANCE_ID: local-b
      API_PORT: 3333
      DATABASE_URL: postgres://giromesa:giromesa@postgres:5432/giromesa
      DATABASE_POOL_MAX: 12
      REDIS_URL: redis://redis:6379
      REALTIME_POLL_INTERVAL_MS: 1000
      REALTIME_BATCH_LIMIT: 200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-proxy:
    image: nginx:1.27-alpine
    ports:
      - "3335:80"
    volumes:
      - ./ops/topology-local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-a
      - api-b
